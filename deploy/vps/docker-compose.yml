# One production OpenMausBot server on a VPS (deploy/vps/README.md): the
# server built from this checkout, plus Caddy for HTTPS on DOMAIN. Run it
# through deploy/vps/omb, which builds the base image first.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 and the server never binds a public interface.
name: openmausbot

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  omb:
    build:
      context: .
      args:
        BASE_IMAGE: openmausbot-server:local
    image: openmausbot-vps:local
    restart: unless-stopped
    init: true
    shm_size: 512m
    logging: *logging
    security_opt:
      # bubblewrap needs unshare/mount/pivot_root inside its own user namespace,
      # which Docker's default seccomp and AppArmor profiles refuse; bootstrap.sh
      # loads the AppArmor profile on the host (docs/bot-box.md).
      - seccomp=./seccomp-bot-box.json
      - apparmor=${OMB_APPARMOR_PROFILE:-openmausbot-omb}
      # The kernel mounts a box's own /proc only when no path of the
      # container's /proc is masked.
      - systempaths=unconfined
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OMB_PORT: "8799"
      OMB_WEBHOOK_PORT: "8800"
      OMB_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in deploy/vps/.env}
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
      OMB_SIGNIN_MEMBER_EMAILS: ${OMB_SIGNIN_MEMBER_EMAILS:-}
      OMB_BOT_BOX: ${OMB_BOT_BOX:-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: "service:omb"
    logging: *logging
    depends_on:
      omb:
        condition: service_healthy
        restart: true
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
